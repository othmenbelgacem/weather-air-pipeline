name: Daily pipeline

on:
  schedule:
    - cron: "0 3 * * *"     
  workflow_dispatch:         

permissions:
  contents: write           

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests pandas sqlalchemy pytest

      - name: Run tests
        run: python -m pytest

      - name: Run pipeline
        run: python src/pipeline.py

      - name: Sanity check
        run: >
          python -c "import sqlite3;
          n = sqlite3.connect('data/weather_air.db').execute('SELECT COUNT(*) FROM hourly_readings').fetchone()[0];
          assert n > 0, 'hourly_readings is empty'; print(n, 'rows in database')"

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather_air.db
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi